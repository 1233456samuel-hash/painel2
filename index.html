<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Treino</title>
<style>
  :root { --bg: #121212; --card: #1e1e1e; --text: #f0f0f0; --primary: #bb86fc; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
  header { padding: 15px; background: #000; text-align: center; }
  input[type="text"] { width: 90%; padding: 10px; margin-top: 10px; border-radius: 8px; border: none; outline: none; }
  
  .tabs { display: flex; overflow-x: auto; background: #000; padding: 10px; gap: 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; white-space: nowrap; font-size: 14px; }
  .tab-btn.active { background: var(--primary); color: black; font-weight: bold; }
  
  .container { padding: 15px; }
  .exercise-group { display: none; }
  .exercise-group.active { display: block; }
  
  .card { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 10px; }
  .card h3 { margin: 0 0 10px 0; font-size: 18px; }
  .controls { display: flex; gap: 10px; align-items: center; }
  .controls input[type="number"] { width: 60px; padding: 8px; border-radius: 5px; border: none; text-align: center; font-weight: bold; }
  .controls input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--primary); }
  .controls button { background: var(--primary); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; color: black; font-weight: bold; width: 100%; }
  
  .timer-floating { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); padding: 10px 30px; border-radius: 30px; color: black; font-weight: bold; font-size: 18px; display: none; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  
  .tips { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-style: italic; color: #ccc; }
  .audio-player, .counter-section { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
  
  .btn-whatsapp { background: #25D366; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 15px; }
  .counter-btn { background: var(--primary); border: none; padding: 5px 15px; border-radius: 5px; font-weight: bold; margin-left: 10px; }
</style>
</head>
<body>

<header>
  <h2>Painel de Treinos</h2>
  <input type="text" id="search" placeholder="Buscar exercício..." onkeyup="searchExercise()">
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('peito')">Peito</button>
  <button class="tab-btn" onclick="showTab('costas')">Costas</button>
  <button class="tab-btn" onclick="showTab('pernas')">Pernas</button>
</div>

<div class="container">
  <div class="tips" id="daily-tip">Mantenha a postura e hidrate-se!</div>
  
  <div class="audio-player">
    <audio controls style="width: 100%; outline: none;">
      <source src="seu-audio.mp3" type="audio/mpeg">
      Seu navegador não suporta áudio.
    </audio>
  </div>

  <div class="counter-section">
    Treinos concluídos: <span id="workout-count" style="font-weight:bold; font-size: 18px; color: var(--primary);">0</span>
    <button class="counter-btn" onclick="addWorkout()">+1 Treino</button>
  </div>

  <div id="peito" class="exercise-group active">
    <div class="card" data-name="Supino Reto">
      <h3>Supino Reto</h3>
      <div class="controls">
        <input type="number" placeholder="Kg" class="load-input" data-id="supino">
        <input type="checkbox" class="done-check" data-id="supino-check">
        <button onclick="startTimer()">⏳ Descanso</button>
      </div>
    </div>
  </div>

  <div id="costas" class="exercise-group">
    <div class="card" data-name="Puxada Frontal">
      <h3>Puxada Frontal</h3>
      <div class="controls">
        <input type="number" placeholder="Kg" class="load-input" data-id="puxada">
        <input type="checkbox" class="done-check" data-id="puxada-check">
        <button onclick="startTimer()">⏳ Descanso</button>
      </div>
    </div>
  </div>

  <div id="pernas" class="exercise-group">
    <div class="card" data-name="Agachamento">
      <h3>Agachamento</h3>
      <div class="controls">
        <input type="number" placeholder="Kg" class="load-input" data-id="agachamento">
        <input type="checkbox" class="done-check" data-id="agachamento-check">
        <button onclick="startTimer()">⏳ Descanso</button>
      </div>
    </div>
    <div class="card" data-name="Cadeira Extensora">
      <h3>Cadeira Extensora</h3>
      <div class="controls">
        <input type="number" placeholder="Kg" class="load-input" data-id="extensora">
        <input type="checkbox" class="done-check" data-id="extensora-check">
        <button onclick="startTimer()">⏳ Descanso</button>
      </div>
    </div>
  </div>

  <button class="btn-whatsapp" onclick="shareWhatsApp()">📱 Compartilhar Progresso</button>
</div>

<div class="timer-floating" id="timer">01:00</div>

<script>
  const tips = [
    "Beba água entre as séries!", 
    "Foque na contração muscular, não apenas no peso.", 
    "A postura correta evita lesões.", 
    "Chegando perto de pular que nem boxeador! Bora pro treino.",
    "Respeite seu limite, mas entregue seu máximo!"
  ];
  document.getElementById('daily-tip').innerText = tips[Math.floor(Math.random() * tips.length)];

  function showTab(tabId) {
    document.querySelectorAll('.exercise-group').forEach(group => group.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  function searchExercise() {
    let input = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      let name = card.getAttribute('data-name').toLowerCase();
      card.style.display = name.includes(input) ? "block" : "none";
    });
  }

  let currentInterval;
  function startTimer() {
    let timerEl = document.getElementById('timer');
    timerEl.style.display = "block";
    let timeLeft = 60; // 1 minuto de descanso
    timerEl.innerText = `01:00`;
    
    if(currentInterval) clearInterval(currentInterval);
    
    currentInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      let s = (timeLeft % 60).toString().padStart(2, '0');
      timerEl.innerText = `${m}:${s}`;
      
      if (timeLeft <= 0) {
        clearInterval(currentInterval);
        timerEl.style.display = "none";
        if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]); // Vibra o celular ao fim
        alert("Fim do descanso! Bora pra próxima série!");
      }
    }, 1000);
  }

  function addWorkout() {
    let count = parseInt(localStorage.getItem('workoutCount') || '0') + 1;
    localStorage.setItem('workoutCount', count);
    document.getElementById('workout-count').innerText = count;
  }

  function shareWhatsApp() {
    let count = localStorage.getItem('workoutCount') || 0;
    let text = `🏋️ Treino Concluído no Painel!\n🔥 Total de treinos acumulados: ${count}\n\nAcompanhando a evolução dia após dia!`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
  }

  // LocalStorage - Salvar Cargas
  document.querySelectorAll('.load-input').forEach(input => {
    let id = input.getAttribute('data-id');
    if(localStorage.getItem(id)) input.value = localStorage.getItem(id);
    input.addEventListener('input', () => localStorage.setItem(id, input.value));
  });

  // LocalStorage - Salvar Status do Checkbox
  document.querySelectorAll('.done-check').forEach(check => {
    let id = check.getAttribute('data-id');
    if(localStorage.getItem(id) === 'true') check.checked = true;
    check.addEventListener('change', () => localStorage.setItem(id, check.checked));
  });

  // Inicializar Contador ao abrir a página
  document.getElementById('workout-count').innerText = localStorage.getItem('workoutCount') || '0';
</script>
</body>
</html>
